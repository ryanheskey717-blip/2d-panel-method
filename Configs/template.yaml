## NOTE: if anything is added here the Config class must be updated accordingly

# settings
verbose: True

# input
geo_file: "Geometries/naca0012_100.dat"
chord: 0.1 # m (reference length)
ref_position: [0, 0] # x(m), y(m)

# flow conditions
M_inf: 0.1
T_inf: 20 # deg C
rho_inf: 1.226 # kg/m^3
p_inf: 101325 # Pa

# geometry conditions
alpha: 0 # deg

# solver
control_point_offset: 1e-7 # m (for numerical stability)

# wake


# turbulence/viscous


# flow properties
pressure_calculation: "inviscid_bernoulli"

# visualisation
visualisation: False

