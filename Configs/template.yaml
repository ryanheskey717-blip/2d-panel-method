## NOTE: if anything is added here the Config class must be updated accordingly

# settings
verbose: True

# input
geo_file: "Geometries/naca0012_100.dat"
chord: 1.0 # m (reference length)
ref_position: [0.25, 0] # x(m), y(m)

# flow conditions
M_inf: 0.1
T_inf: 20 # deg C
rho_inf: 1.225 # kg/m^3
mu_inf: 1.81e-5
p_inf: 101325 # Pa

# geometry conditions
alpha: 5 # deg

# solver
control_point_offset: 1.0e-7 # m (for numerical stability) ( < 1e-5 )
convergence_criterion: 0 # 0: double iteration to include bl thickness (or single for no bl). Else: num for change in coeffs/residuals (suggest: 1e-2?)

# turbulence/viscous
boundary_layer: 'none' # 'none' or 'blasius' supported currently 
inflation_layers: 10
wake_starting_index: -1 # 0 for start, -1 for end
wake_points: 10 # number of points in wake
wake_length: 0.2 # m

# flow properties
pressure_calculation: "inviscid_bernoulli"

# visualisation
visualisation: True
grid_method: 'conformal' # 'cartesian': rectangle OR 'conformal': wraps around body
vis_geo: [False, False, False, False, False, False] # [vertices, control_points, normals, tangents, boundary_layer, global coords.]
streamlines_colour: 'none' # 'none', 'velocity', or plt colour
contour_type: 'cp' # 'none', 'vx', 'vy', 'vmag' or 'cp'
scale: 'auto'

# output
output:
  write_to_file: False
  overwrite: True
  coefficients: 'Output/example_out.csv'